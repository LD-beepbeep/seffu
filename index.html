<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <title>Seffu Translator</title>
  <style>
    :root {
      color-scheme: light;
      --bg: radial-gradient(circle at top, #f7f8fc 0%, #eef1fb 45%, #e7edff 100%);
      --surface: rgba(255, 255, 255, 0.82);
      --surface-strong: rgba(255, 255, 255, 0.94);
      --surface-border: rgba(120, 127, 157, 0.18);
      --text: #0f172a;
      --muted: #5f6b85;
      --accent: #0a84ff;
      --accent-soft: rgba(10, 132, 255, 0.14);
      --danger: #ff453a;
      --shadow: 0 22px 52px rgba(17, 24, 39, 0.14);
      --focus: 0 0 0 3px color-mix(in oklab, var(--accent) 35%, transparent);
    }

    body.dark {
      color-scheme: dark;
      --bg: radial-gradient(circle at top, #1f2335 0%, #15192a 54%, #0b0f1d 100%);
      --surface: rgba(24, 29, 48, 0.72);
      --surface-strong: rgba(24, 29, 48, 0.88);
      --surface-border: rgba(153, 164, 205, 0.18);
      --text: #f5f8ff;
      --muted: #a4b0d2;
      --accent: #4da3ff;
      --accent-soft: rgba(77, 163, 255, 0.2);
      --danger: #ff6961;
      --shadow: 0 26px 65px rgba(2, 6, 23, 0.62);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "SF Pro Text", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.35s ease, color 0.35s ease;
    }

    body {
      display: flex;
      justify-content: center;
      padding: clamp(12px, 3vw, 28px);
    }

    .phone-shell {
      width: min(460px, 100%);
      border-radius: 36px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .safe-top {
      height: max(8px, env(safe-area-inset-top));
      background: transparent;
    }

    .safe-bottom {
      height: max(8px, env(safe-area-inset-bottom));
      background: transparent;
    }

    .screen {
      padding: 18px;
    }

    h1, h2, h3, p { margin: 0; }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .hero-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-dot {
      width: 32px;
      height: 32px;
      border-radius: 11px;
      background: linear-gradient(165deg, #67c4ff 0%, #0077ff 55%, #0050d8 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 18px rgba(10, 80, 190, 0.32);
      display: grid;
      place-items: center;
      color: #fff;
      flex: 0 0 auto;
    }

    .app-dot svg {
      width: 18px;
      height: 18px;
    }

    .hero p {
      margin-top: 3px;
      font-size: .85rem;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .card {
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      background: var(--surface-strong);
      padding: 14px;
      margin-bottom: 12px;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 8px;
      border-radius: 15px;
      background: color-mix(in oklab, var(--surface-strong) 78%, #cfd5ea 22%);
      margin-bottom: 10px;
    }

    .segment {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 9px 10px;
      text-align: center;
      font-size: .88rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: .2s ease;
    }

    .segment.active {
      color: var(--text);
      border-color: color-mix(in oklab, var(--accent) 35%, transparent);
      background: color-mix(in oklab, var(--accent) 20%, var(--surface-strong));
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .82rem;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      min-height: 132px;
      resize: vertical;
      background: color-mix(in oklab, var(--surface-strong) 86%, #aeb8da 14%);
      color: var(--text);
      padding: 12px;
      font-size: .97rem;
      font-family: inherit;
      line-height: 1.44;
      outline: none;
    }

    .output {
      width: 100%;
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      min-height: 132px;
      background: color-mix(in oklab, var(--surface-strong) 87%, #aeb8da 13%);
      padding: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .output.placeholder {
      color: var(--muted);
    }

    button, .chip {
      border-radius: 12px;
      border: 1px solid transparent;
      padding: 9px 12px;
      font-size: .9rem;
      font-family: inherit;
      color: var(--text);
      background: color-mix(in oklab, var(--surface-strong) 82%, #bec8eb 18%);
      cursor: pointer;
      display: inline-flex;
      gap: 7px;
      align-items: center;
      transition: transform .12s ease, border-color .2s ease, background .2s ease;
    }

    button:hover, .chip:hover { transform: translateY(-1px); }
    button:focus-visible, textarea:focus-visible, input:focus-visible { outline: none; box-shadow: var(--focus); }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }

    button.soft {
      background: var(--accent-soft);
      border-color: color-mix(in oklab, var(--accent) 38%, transparent);
    }

    button.warn {
      color: var(--danger);
      border-color: color-mix(in oklab, var(--danger) 35%, transparent);
    }

    button svg {
      width: 14px;
      height: 14px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .row > * {
      flex: 1 1 auto;
      justify-content: center;
    }

    .status {
      margin-top: 10px;
      min-height: 20px;
      font-size: .85rem;
      color: var(--muted);
    }

    .settings {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 12px;
      border: 1px solid var(--surface-border);
      background: color-mix(in oklab, var(--surface-strong) 84%, #bec8eb 16%);
      font-size: .86rem;
      color: var(--muted);
      cursor: pointer;
    }

    .toggle input { accent-color: var(--accent); }

    .history-wrap {
      margin-top: 6px;
    }

    .history-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .chip {
      white-space: nowrap;
      font-size: .8rem;
      color: var(--muted);
    }

    .chip strong {
      color: var(--text);
      font-weight: 600;
    }

    #historyEmpty {
      color: var(--muted);
      font-size: .84rem;
      margin-top: 2px;
    }

    #app { display: none; }

    .login-card {
      padding-top: 26px;
      padding-bottom: 22px;
    }

    .login-heading {
      text-align: center;
      margin-bottom: 16px;
    }

    .login-heading h2 {
      margin-bottom: 5px;
    }

    .login-heading p {
      color: var(--muted);
      font-size: .9rem;
    }

    input[type="password"] {
      width: 100%;
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      padding: 12px;
      font-size: .95rem;
      background: color-mix(in oklab, var(--surface-strong) 88%, #aeb8da 12%);
      color: var(--text);
      outline: none;
      margin-bottom: 10px;
    }

    #loginStatus {
      min-height: 20px;
      margin-top: 8px;
      color: var(--danger);
      font-size: .86rem;
      text-align: center;
    }

    @media (max-width: 430px) {
      .phone-shell { border-radius: 26px; }
      .screen { padding: 14px; }
      .hero h1 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <div class="safe-top"></div>

    <div id="login" class="screen login-card">
      <div class="login-heading">
        <h2>Welkom bij Seffu</h2>
        <p>Ontgrendel de vertaler om te starten.</p>
      </div>
      <input type="password" id="wachtwoord" placeholder="Wachtwoord" autocomplete="current-password" />
      <button class="primary" onclick="controleerWachtwoord()">Inloggen</button>
      <div id="loginStatus" aria-live="polite"></div>
    </div>

    <div id="app" class="screen">
      <header class="hero">
        <div class="hero-left">
          <div class="app-dot" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9"/><path d="m10 3 3 4-3 4"/><path d="M20 17h-9"/><path d="m14 13-3 4 3 4"/></svg>
          </div>
          <div>
            <h1>Seffu Translator</h1>
            <p>Snel, strak en mobiel-vriendelijk.</p>
          </div>
        </div>
        <button id="themeBtn" class="soft" type="button" onclick="toggleDarkMode()">Thema</button>
      </header>

      <section class="card">
        <div class="segmented" role="radiogroup" aria-label="Vertaalrichting">
          <button id="encodeBtn" class="segment active" type="button" data-direction="encode">Naar geheimschrift</button>
          <button id="decodeBtn" class="segment" type="button" data-direction="decode">Naar normale tekst</button>
        </div>

        <div class="meta-row">
          <span id="statsInput">Input: 0 tekens · 0 woorden</span>
          <span id="statsOutput">Output: 0 tekens · 0 woorden</span>
        </div>

        <textarea id="input" placeholder="Typ, plak of spreek je tekst hier..."></textarea>

        <div class="row">
          <button id="translateBtn" class="primary" type="button" onclick="vertaal(true, true)">Vertaal nu</button>
          <button id="swapBtn" type="button" onclick="wisselRichting()">Wissel richting</button>
        </div>

        <div class="settings" style="margin-top:10px;">
          <label class="toggle" for="livePreview"><input id="livePreview" type="checkbox" checked /> Live preview</label>
          <button type="button" onclick="plakUitClipboard()">Plakken</button>
          <button id="installBtn" type="button" style="display:none;" onclick="installeerApp()">Installeer app</button>
        </div>
      </section>

      <section class="card">
        <div class="meta-row">
          <strong>Resultaat</strong>
          <button type="button" onclick="kopieerOutput()">Kopieer</button>
        </div>

        <div id="output" class="output placeholder">Je vertaling verschijnt hier.</div>

        <div class="row">
          <button type="button" onclick="voorlezen()">Voorlezen</button>
          <button type="button" onclick="spreekIn()">Inspreken</button>
          <button type="button" onclick="deelOutput()">Delen</button>
        </div>

        <div class="row">
          <button type="button" class="warn" onclick="maakLeeg()">Leegmaken</button>
          <button id="undoBtn" type="button" onclick="herstelLaatste()" disabled>Ongedaan maken</button>
          <button type="button" onclick="downloadOutput()">Download .txt</button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
      </section>

      <section class="card history-wrap">
        <div class="meta-row" style="margin-bottom:6px;">
          <strong>Recente vertalingen</strong>
          <button type="button" onclick="wisGeschiedenis()">Wis</button>
        </div>
        <div id="historyList" class="history-row"></div>
        <div id="historyEmpty">Nog geen recente vertalingen.</div>
      </section>
    </div>

    <div class="safe-bottom"></div>
  </div>

  <script>
    const juistWachtwoord = "K";

    const cipher = {
      a: "e", b: "r", c: "x", d: "w", e: "a",
      f: "l", g: "t", h: "s", i: "y", j: "q",
      k: "p", l: "f", m: "n", n: "m", o: "u",
      p: "k", q: "j", r: "b", s: "h", t: "g",
      u: "o", v: "z", w: "d", x: "c", y: "i", z: "v"
    };

    const reverseCipher = Object.fromEntries(Object.entries(cipher).map(([k, v]) => [v, k]));

    const STORAGE_KEYS = {
      input: "seffu.input",
      direction: "seffu.direction",
      live: "seffu.live",
      dark: "seffu.dark",
      history: "seffu.history"
    };

    const inputField = document.getElementById("input");
    const outputDiv = document.getElementById("output");
    const livePreview = document.getElementById("livePreview");
    const statsInput = document.getElementById("statsInput");
    const statsOutput = document.getElementById("statsOutput");
    const statusMessage = document.getElementById("status");
    const loginStatus = document.getElementById("loginStatus");
    const historyList = document.getElementById("historyList");
    const historyEmpty = document.getElementById("historyEmpty");
    const undoBtn = document.getElementById("undoBtn");

    const encodeBtn = document.getElementById("encodeBtn");
    const decodeBtn = document.getElementById("decodeBtn");
    let currentDirection = "encode";

    let deferredPrompt = null;
    let lastClearedSnapshot = null;

    function controleerWachtwoord() {
      const invoer = document.getElementById("wachtwoord").value;
      if (invoer === juistWachtwoord) {
        loginStatus.textContent = "";
        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "block";
        hydrateSavedState();
        vertaal(true);
        zetStatus("Klaar om te vertalen.");
      } else {
        loginStatus.textContent = "Onjuist wachtwoord.";
      }
    }

    function zetStatus(tekst, isFout = false) {
      statusMessage.textContent = tekst;
      statusMessage.style.color = isFout ? "var(--danger)" : "var(--muted)";
    }

    function wordCount(text) {
      return (text.trim().match(/\S+/g) || []).length;
    }

    function updateStats(inputText, outputText) {
      statsInput.textContent = `Input: ${inputText.length} tekens · ${wordCount(inputText)} woorden`;
      statsOutput.textContent = `Output: ${outputText.length} tekens · ${wordCount(outputText)} woorden`;
    }

    function setDirection(direction) {
      currentDirection = direction;
      encodeBtn.classList.toggle("active", direction === "encode");
      decodeBtn.classList.toggle("active", direction === "decode");
      localStorage.setItem(STORAGE_KEYS.direction, direction);
    }

    function translateText(text, direction) {
      const map = direction === "encode" ? cipher : reverseCipher;
      let result = "";
      for (const char of text) {
        const lower = char.toLowerCase();
        const translated = map[lower] || char;
        result += char === lower ? translated : translated.toUpperCase();
      }
      return result;
    }

    function updateOutput(text) {
      if (!text) {
        outputDiv.classList.add("placeholder");
        outputDiv.textContent = "Je vertaling verschijnt hier.";
        return;
      }
      outputDiv.classList.remove("placeholder");
      outputDiv.textContent = text;
    }

    function saveInputState() {
      localStorage.setItem(STORAGE_KEYS.input, inputField.value);
      localStorage.setItem(STORAGE_KEYS.live, String(livePreview.checked));
    }

    function vertaaltNuNodig(force) {
      return force || livePreview.checked;
    }

    function vertaal(force = false, saveHistory = false) {
      const text = inputField.value;
      if (!vertaaltNuNodig(force)) {
        updateStats(text, outputDiv.classList.contains("placeholder") ? "" : outputDiv.textContent);
        saveInputState();
        return;
      }

      const result = translateText(text, currentDirection);
      updateOutput(result);
      updateStats(text, result);
      saveInputState();
      zetStatus(result ? "Vertaling bijgewerkt." : "Voer tekst in om te starten.");
      if (saveHistory) {
        bewaarGeschiedenis(text, result);
      }
    }

    function kopieerTekst(tekst, succesMelding) {
      if (!tekst) {
        zetStatus("Er is geen tekst om te kopiëren.", true);
        return;
      }
      navigator.clipboard.writeText(tekst)
        .then(() => zetStatus(succesMelding))
        .catch(() => zetStatus("Kopiëren mislukt in deze browsercontext.", true));
    }

    function kopieerOutput() {
      const tekst = outputDiv.classList.contains("placeholder") ? "" : outputDiv.textContent;
      kopieerTekst(tekst, "Output gekopieerd.");
    }

    function voorlezen() {
      const tekst = outputDiv.classList.contains("placeholder") ? "" : outputDiv.textContent.trim();
      if (!tekst) {
        zetStatus("Geen output om voor te lezen.", true);
        return;
      }
      const synth = window.speechSynthesis;
      const utter = new SpeechSynthesisUtterance(tekst);
      utter.lang = "nl-NL";
      synth.cancel();
      synth.speak(utter);
      zetStatus("Output wordt voorgelezen.");
    }

    function spreekIn() {
      if (!("webkitSpeechRecognition" in window)) {
        zetStatus("Spraakherkenning is niet beschikbaar in deze browser.", true);
        return;
      }
      const recognition = new webkitSpeechRecognition();
      recognition.lang = "nl-NL";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.start();
      zetStatus("Luisteren... spreek je zin in.");

      recognition.onresult = (event) => {
        inputField.value = event.results[0][0].transcript;
        vertaal(true, true);
      };

      recognition.onerror = () => zetStatus("Fout bij spraakherkenning.", true);
    }

    function maakLeeg() {
      lastClearedSnapshot = {
        input: inputField.value,
        output: outputDiv.classList.contains("placeholder") ? "" : outputDiv.textContent
      };
      undoBtn.disabled = !(lastClearedSnapshot.input || lastClearedSnapshot.output);
      inputField.value = "";
      updateOutput("");
      updateStats("", "");
      saveInputState();
      zetStatus("Input en output gewist.");
      inputField.focus();
      if (navigator.vibrate) navigator.vibrate(8);
    }

    function herstelLaatste() {
      if (!lastClearedSnapshot) {
        zetStatus("Er is niets om te herstellen.", true);
        return;
      }
      inputField.value = lastClearedSnapshot.input;
      updateOutput(lastClearedSnapshot.output);
      updateStats(lastClearedSnapshot.input, lastClearedSnapshot.output);
      saveInputState();
      zetStatus("Laatste verwijdering ongedaan gemaakt.");
      undoBtn.disabled = true;
    }

    function wisselRichting() {
      setDirection(currentDirection === "encode" ? "decode" : "encode");
      vertaal(true, true);
    }

    function downloadOutput() {
      const text = outputDiv.classList.contains("placeholder") ? "" : outputDiv.textContent;
      if (!text) {
        zetStatus("Geen output om te downloaden.", true);
        return;
      }
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "seffu-output.txt";
      link.click();
      URL.revokeObjectURL(url);
      zetStatus("Output gedownload als .txt bestand.");
    }

    async function plakUitClipboard() {
      try {
        const tekst = await navigator.clipboard.readText();
        if (!tekst) {
          zetStatus("Clipboard is leeg.", true);
          return;
        }
        inputField.value = tekst;
        vertaal(true, true);
        zetStatus("Tekst geplakt vanuit clipboard.");
      } catch {
        zetStatus("Plakken niet toegestaan in deze browsercontext.", true);
      }
    }

    async function deelOutput() {
      const text = outputDiv.classList.contains("placeholder") ? "" : outputDiv.textContent;
      if (!text) {
        zetStatus("Geen output om te delen.", true);
        return;
      }

      if (navigator.share) {
        try {
          await navigator.share({ title: "Seffu output", text });
          zetStatus("Output gedeeld.");
          return;
        } catch {
          zetStatus("Delen geannuleerd.");
          return;
        }
      }

      kopieerTekst(text, "Delen niet ondersteund, output gekopieerd.");
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
      localStorage.setItem(STORAGE_KEYS.dark, document.body.classList.contains("dark") ? "1" : "0");
    }

    function readHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.history) || "[]");
      } catch {
        return [];
      }
    }

    function writeHistory(items) {
      localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(items.slice(0, 8)));
    }

    function bewaarGeschiedenis(input, output) {
      if (!input.trim() || !output.trim()) return;
      const items = readHistory();
      const normalized = input.trim();
      const deduped = items.filter((item) => item.input !== normalized || item.output !== output);
      deduped.unshift({
        input: normalized,
        output,
        direction: currentDirection,
        ts: new Date().toISOString()
      });
      writeHistory(deduped);
      renderHistory();
    }

    function restoreHistoryItem(index) {
      const items = readHistory();
      const item = items[index];
      if (!item) return;
      inputField.value = item.input;
      setDirection(item.direction || "encode");
      vertaal(true);
      zetStatus("Recente vertaling geladen.");
    }

    function wisGeschiedenis() {
      writeHistory([]);
      renderHistory();
      zetStatus("Recente vertalingen gewist.");
    }

    function tijdLabel(iso) {
      try {
        return new Intl.DateTimeFormat("nl-NL", { hour: "2-digit", minute: "2-digit" }).format(new Date(iso));
      } catch {
        return "recent";
      }
    }

    function renderHistory() {
      const items = readHistory();
      historyList.innerHTML = "";
      historyEmpty.style.display = items.length ? "none" : "block";

      items.forEach((item, index) => {
        const button = document.createElement("button");
        button.className = "chip";
        button.type = "button";
        button.innerHTML = `<strong>${item.direction === "decode" ? "Decode" : "Encode"}</strong> · ${tijdLabel(item.ts)} · ${item.input.slice(0, 24)}${item.input.length > 24 ? "…" : ""}`;
        button.addEventListener("click", () => restoreHistoryItem(index));
        historyList.appendChild(button);
      });
    }

    function hydrateSavedState() {
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const storedDark = localStorage.getItem(STORAGE_KEYS.dark);
      const shouldBeDark = storedDark === null ? prefersDark : storedDark === "1";
      document.body.classList.toggle("dark", shouldBeDark);

      const storedDirection = localStorage.getItem(STORAGE_KEYS.direction) || "encode";
      setDirection(storedDirection === "decode" ? "decode" : "encode");
      inputField.value = localStorage.getItem(STORAGE_KEYS.input) || "";
      livePreview.checked = localStorage.getItem(STORAGE_KEYS.live) !== "false";
      renderHistory();
    }

    async function installeerApp() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById("installBtn").style.display = "none";
    }

    encodeBtn.addEventListener("click", () => {
      setDirection("encode");
      vertaal(true, true);
    });

    decodeBtn.addEventListener("click", () => {
      setDirection("decode");
      vertaal(true, true);
    });

    inputField.addEventListener("input", () => vertaal());
    livePreview.addEventListener("change", () => {
      localStorage.setItem(STORAGE_KEYS.live, String(livePreview.checked));
      zetStatus(livePreview.checked ? "Live preview ingeschakeld." : "Live preview uitgeschakeld.");
      if (livePreview.checked) vertaal(true, true);
    });

    document.getElementById("wachtwoord").addEventListener("keydown", (event) => {
      if (event.key === "Enter") controleerWachtwoord();
    });

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      document.getElementById("installBtn").style.display = "inline-flex";
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {
          if (document.getElementById("app").style.display === "block") {
            zetStatus("PWA offline ondersteuning kon niet worden geladen.", true);
          }
        });
      });
    }
  </script>
</body>
</html>
